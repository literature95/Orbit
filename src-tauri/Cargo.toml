[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit desktop automation hub"
edition = "2024"
rust-version = "1.90"
default-run = "orbit-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ======== 第二个二进制：临时管理员 sidecar ========
# 主进程普通权限，需要管理员功能时 runas 拉起这个 helper
[[bin]]
name = "orbit-elevated-helper"
path = "src/helper/main.rs"

[[bin]]
name = "orbit-mcp"
path = "src/mcp/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# 实机冒烟测试：依赖真实 ffmpeg / PowerShell / 剪贴板 / 键鼠钩子，
# 仅在本地或专用 CI 作业以 `--features smoke` 显式开启，默认 CI 只跑纯单测。
[features]
smoke = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
orbit-core = { version = "0.1.0", path = "../crates/orbit-core" }
orbit-ocr = { version = "0.1.0", path = "../crates/orbit-ocr" }
xcap = "0.9.8"
arboard = "3.7.0"
# 剪贴板：OS 级事件监听（Windows WM_CLIPBOARDUPDATE）+ 多格式读取
clipboard-rs = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
base64 = "0.21"
# 远程只读服务的一次性配对令牌；只用 OS 熵，不引入完整 rand。
getrandom = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Foundation", "Foundation_Collections", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }
# enigo：键鼠回放（命令 kb.replay）与录制冒烟测试共用；仅 Windows 编译。
enigo = "0.2"

# helper 二进制与主进程共享 serde / serde_json；sysinfo 仅保留 system feature。
