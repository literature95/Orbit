[package]
name = "orbit-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
